name: SME MIS CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: sme-mis-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verification summary
        if: always()
        run: |
          echo "Verification workflow completed."
          echo "Production deployment is handled by the Vercel Git integration after an approved merge to main."

  vercel-build-parity:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Vercel credential
        id: credential
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured; Vercel parity build will be skipped."
          fi

      - name: Pull Vercel preview settings
        if: steps.credential.outputs.configured == 'true'
        run: npx --yes vercel@58.4.4 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Reproduce Vercel preview build
        if: steps.credential.outputs.configured == 'true'
        run: npx --yes vercel@58.4.4 build --token="$VERCEL_TOKEN"

      - name: Parity result
        if: steps.credential.outputs.configured != 'true'
        run: echo "Vercel parity build was not executed because VERCEL_TOKEN is unavailable."
